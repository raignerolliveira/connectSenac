<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Senac - Criar Conta</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Premium Design System -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light py-4">

    <div class="container d-flex justify-content-center">
        <div class="col-12 col-lg-7 col-xl-6">
            <div class="card-premium p-3.5 p-md-4">
                <div class="text-center mb-3">
                    <div class="d-inline-flex align-items-center gap-2 mb-1.5">
                        <div class="sidebar-logo-icon" style="width: 32px; height: 32px; font-size: 1rem;">
                            <i class="bi bi-person-plus-fill"></i>
                        </div>
                        <h4 class="sidebar-brand-title text-dark mb-0" style="font-size: 1.1rem;">Connect <span style="color: var(--senac-navy);">Senac</span></h4>
                    </div>
                    <h3 class="fw-bold font-heading mb-1" style="color: var(--senac-navy); font-size: 1.3rem;">Criar Nova Conta</h3>
                    <p class="text-muted small mb-0" style="font-size: 0.82rem;">Cadastre-se como modelo para participar das práticas gratuitas</p>
                </div>

                <form id="formCadastro">
                    <div class="form-floating mb-2.5">
                        <input type="text" class="form-control" id="nome" placeholder="Nome Completo" required>
                        <label for="nome"><i class="bi bi-person me-1"></i> Nome Completo</label>
                    </div>

                    <div class="row g-2.5 mb-2.5">
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="email" class="form-control" id="email" placeholder="E-mail" required>
                                <label for="email"><i class="bi bi-envelope me-1"></i> E-mail</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="tel" class="form-control" id="telefone" placeholder="(75) 99999-9999" required>
                                <label for="telefone"><i class="bi bi-whatsapp me-1"></i> WhatsApp</label>
                            </div>
                        </div>
                    </div>

                    <div class="row g-2.5 mb-3">
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="password" class="form-control" id="senha" placeholder="Palavra-passe" minlength="6" required>
                                <label for="senha"><i class="bi bi-lock me-1"></i> Senha (mín. 6)</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="password" class="form-control" id="confirmar_senha" placeholder="Confirmar Senha" minlength="6" required>
                                <label for="confirmar_senha"><i class="bi bi-check2-circle me-1"></i> Confirmar Senha</label>
                            </div>
                        </div>
                    </div>

                    <!-- LGPD Card -->
                    <div class="p-3 bg-light rounded-3 mb-3 border">
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <i class="bi bi-shield-check text-primary fs-6"></i>
                            <h6 class="fw-bold mb-0 font-heading text-dark" style="font-size: 0.88rem;">Privacidade e Termos (LGPD)</h6>
                        </div>
                        
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="termoUso" required>
                            <label class="form-check-label small text-secondary" for="termoUso" style="font-size: 0.78rem;">
                                Li e aceito os <a href="#" class="text-decoration-none fw-bold" style="color: var(--senac-navy);">Termos de Uso</a> e a <a href="#" class="text-decoration-none fw-bold" style="color: var(--senac-navy);">Política de Privacidade</a> do Senac.*
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="termoImagem">
                            <label class="form-check-label small text-muted" for="termoImagem" style="font-size: 0.75rem;">
                                Autorizo a captação e uso didático de imagens dos procedimentos para o portfólio acadêmico da turma (Opcional).
                            </label>
                        </div>
                    </div>

                    <div id="mensagemCadastro" class="mb-3 text-center small fw-bold"></div>

                    <button type="submit" class="btn btn-brand w-100 py-2.5 fw-bold">
                        <i class="bi bi-check2-circle me-1"></i> Finalizar Cadastro
                    </button>
                </form>

                <div class="text-center mt-3 pt-2.5 border-top">
                    <p class="text-muted small mb-0" style="font-size: 0.82rem;">
                        Já possui uma conta? <a href="index.html" class="fw-bold text-decoration-none" style="color: var(--senac-navy);">Fazer Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
