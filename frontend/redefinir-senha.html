<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Nova Senha - Connect Senac</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Premium Design System -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center bg-light min-vh-100 py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-5 col-xl-4">
                <div class="card-premium p-3.5 p-md-4">
                    <div class="text-center mb-3">
                        <div class="d-inline-flex align-items-center justify-content-center stat-icon-wrapper stat-icon-gold mx-auto mb-2" style="width: 38px; height: 38px; font-size: 1.1rem;">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                        <h4 class="fw-bold font-heading mb-1" style="color: var(--senac-navy); font-size: 1.2rem;">Nova Senha</h4>
                        <p class="small text-muted mb-0" style="font-size: 0.82rem;">Crie uma nova palavra-passe segura</p>
                    </div>

                    <form id="formRedefinir">
                        <div class="form-floating mb-2.5">
                            <input type="password" class="form-control" id="novaSenha" placeholder="Nova Senha" minlength="6" required>
                            <label for="novaSenha"><i class="bi bi-lock me-1"></i> Nova Palavra-passe</label>
                        </div>
                        <div class="form-floating mb-2.5">
                            <input type="password" class="form-control" id="confirmarNovaSenha" placeholder="Confirmar Senha" minlength="6" required>
                            <label for="confirmarNovaSenha"><i class="bi bi-check2-circle me-1"></i> Confirmar Nova Palavra-passe</label>
                        </div>
                        <div id="msgRedefinir" class="small text-center mb-2.5 fw-bold"></div>
                        <button type="submit" class="btn btn-brand w-100 py-2.5 mb-2 fw-bold">
                            <i class="bi bi-arrow-repeat me-1"></i> Atualizar Palavra-passe
                        </button>
                        <a href="index.html" class="btn btn-light w-100 py-1.5 text-muted fw-semibold" style="font-size: 0.84rem;">
                            Voltar ao Login
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
