<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Senac — Redefinir Senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:2rem 1rem; background:var(--bg-app); }
        .auth-mini-box {
            width:100%; max-width:400px;
            background:#FFFFFF;
            border:1px solid var(--border-subtle);
            border-radius:var(--radius-lg);
            padding:2.25rem 2rem;
            box-shadow:var(--shadow-card);
        }
        .auth-mini-icon {
            width:48px; height:48px;
            border-radius:var(--radius-pill);
            background:var(--status-success-bg);
            border:1px solid var(--status-success-border);
            display:flex; align-items:center; justify-content:center;
            color:var(--status-success); font-size:1.3rem;
            margin-bottom:1.25rem;
        }
        .auth-mini-title { font-family:var(--font-brand); font-size:var(--text-xl); font-weight:700; color:var(--text-primary); letter-spacing:-0.015em; margin-bottom:0.35rem; }
        .auth-mini-sub { font-family:var(--font-sans); font-size:var(--text-xs); color:var(--text-secondary); margin-bottom:1.75rem; line-height:1.5; }
        #msgRedefinir { font-family:var(--font-sans); font-size:var(--text-xs); }
    </style>
</head>
<body>
    <div class="auth-mini-box">
        <div class="auth-mini-icon"><i class="bi bi-shield-lock"></i></div>
        <h1 class="auth-mini-title">Criar Nova Senha</h1>
        <p class="auth-mini-sub">Crie uma nova senha segura para acessar sua conta institucional.</p>

        <form id="formRedefinir">
            <div class="field-group">
                <label for="novaSenha">Nova Senha <span style="color:var(--text-muted);font-size:11px;font-weight:400;">(mín. 6)</span></label>
                <input type="password" class="field-input" id="novaSenha" placeholder="••••••••" minlength="6" required autocomplete="new-password">
            </div>

            <div class="field-group">
                <label for="confirmarNovaSenha">Confirmar Nova Senha</label>
                <input type="password" class="field-input" id="confirmarNovaSenha" placeholder="••••••••" minlength="6" required autocomplete="new-password">
            </div>

            <div id="msgRedefinir" class="mb-3 text-center"></div>

            <button type="submit" class="btn-brand w-100" style="margin-bottom:0.75rem;height:40px;">
                <i class="bi bi-arrow-repeat"></i>
                Atualizar Senha
            </button>

            <a href="index.html" class="btn-ghost-light w-100" style="display:flex;justify-content:center;">
                <i class="bi bi-arrow-left me-1"></i>
                Voltar ao Login
            </a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
