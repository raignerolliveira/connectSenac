<!DOCTYPE html>
<html lang=pt-BR>
<head>
    <meta charset=UTF-8>
    <meta name=viewport content=width=device-width, initial-scale=1.0>
    <title>Criar Nova Senha - Connect Senac</title>
    <!-- Google Fonts -->
    <link rel=preconnect href=https://fonts.googleapis.com>
    <link rel=preconnect href=https://fonts.gstatic.com crossorigin>
    <link href=https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap rel=stylesheet>
    <!-- Bootstrap 5 & Icons -->
    <link href=https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css rel=stylesheet>
    <link rel=stylesheet href=https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css>
    <!-- Premium Design System -->
    <link rel=stylesheet href=css/style.css>
</head>
<body class=d-flex align-items-center bg-light vh-100>
    <div class=container>
        <div class=row justify-content-center>
            <div class=col-12 col-md-6 col-lg-5 col-xl-4>
                <div class=card-premium p-4 p-md-5>
                    <div class=text-center mb-4>
                        <div class=d-inline-flex align-items-center justify-content-center stat-icon-wrapper stat-icon-gold mx-auto mb-3>
                            <i class=bi bi-shield-lock-fill fs-3></i>
                        </div>
                        <h3 class=fw-bold font-heading mb-1 style=color: var(--senac-navy);>Nova Senha</h3>
                        <p class=small text-muted mb-0>Crie uma nova palavra-passe de acesso segura</p>
                    </div>

                    <form id=formRedefinir>
                        <div class=form-floating mb-3>
                            <input type=password class=form-control id=novaSenha placeholder=Nova Senha minlength=6 required>
                            <label for=novaSenha><i class=bi bi-lock me-1></i> Nova Palavra-passe</label>
                        </div>
                        <div class=form-floating mb-3>
                            <input type=password class=form-control id=confirmarNovaSenha placeholder=Confirmar Senha minlength=6 required>
                            <label for=confirmarNovaSenha><i class=bi bi-check2-circle me-1></i> Confirmar Nova Palavra-passe</label>
                        </div>
                        <div id=msgRedefinir class=small text-center mb-3 fw-bold></div>
                        <button type=submit class=btn btn-brand w-100 py-3 mb-2 fw-bold>
                            <i class=bi bi-arrow-repeat me-1></i> Atualizar Palavra-passe
                        </button>
                        <a href=index.html class=btn btn-light w-100 py-2 text-muted fw-semibold>
                            Voltar ao Login
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src=js/auth.js></script>
</body>
</html>
